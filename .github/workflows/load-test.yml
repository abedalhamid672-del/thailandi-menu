# Manual load test of our own site, run from GitHub's servers (fast network).
# Start it from the Actions tab → "Load test" → Run workflow. It never runs by itself.
name: Load test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET: https://thailandi-menu.abedalhamid672.workers.dev

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Stage 1: 1000 concurrent users on a tiny file → how many requests the edge answers.
      - name: 1000 users, tiny file
        run: npx -y autocannon@8.0.0 -c 1000 -d 15 --json "$TARGET/robots.txt" > tiny.json

      # Stage 2: 500 concurrent users on the real home page (~150 KB HTML) → real page weight.
      - name: 500 users, home page
        run: npx -y autocannon@8.0.0 -c 500 -d 15 --json "$TARGET/" > home.json

      - name: Summary
        run: |
          node -e '
          const fs = require("fs");
          const rows = [["Stage","Requests","2xx","Non-2xx","Errors","Timeouts","p50 ms","p97.5 ms","p99 ms","Max ms","Req/s","MB/s"]];
          for (const [name, file] of [["1000 users, /robots.txt","tiny.json"],["500 users, /","home.json"]]) {
            const r = JSON.parse(fs.readFileSync(file, "utf8"));
            rows.push([name, r.requests.total, r["2xx"], r.non2xx, r.errors, r.timeouts, r.latency.p50, r.latency.p97_5, r.latency.p99, r.latency.max, Math.round(r.requests.average), (r.throughput.average/1e6).toFixed(1)]);
          }
          const md = rows.map((r,i) => "| " + r.join(" | ") + " |" + (i===0 ? "\n|" + r.map(()=>"---").join("|") + "|" : "")).join("\n");
          console.log(md);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '
